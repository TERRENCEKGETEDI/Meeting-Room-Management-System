[project]
name = "mrms"
version = "0.1.0"
description = "Meeting Room Management System"
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
    "fastapi==0.141.1",
    "greenlet>=3.5.5",
    "psycopg==3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic==2.13.4",
    "pyjwt>=2.13.0",
    "python-dotenv==1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
